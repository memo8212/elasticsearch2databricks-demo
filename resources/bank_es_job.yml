# The nightly department-feed job (replaces the ES bulk loader + Kibana refresh).
resources:
  jobs:
    bank_dept_feeds:
      name: bank_dept_feeds
      tags:
        project: elasticsearch2databricks-poc
      parameters:
        - name: catalog
          default: ${var.catalog}
      job_clusters:
        - job_cluster_key: bank_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
      tasks:
        - task_key: ingest
          job_cluster_key: bank_cluster
          notebook_task:
            notebook_path: ../notebooks/01_ingest_files.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver
          job_cluster_key: bank_cluster
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/02_transform_silver.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: gold_export
          job_cluster_key: bank_cluster
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold_and_export.py
            base_parameters:
              catalog: ${var.catalog}
      email_notifications:
        on_failure:
          - bank-dataops@example.com
      # schedule:
      #   quartz_cron_expression: "0 0 2 * * ?"
      #   timezone_id: UTC
